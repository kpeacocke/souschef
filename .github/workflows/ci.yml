name: CI

on:
  push:
    branches:
      - main
      - develop
      - "copilot/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.3.4"
  PIP_AUDIT_POLICY: "fail-on-any"

jobs:
  test-containers:
    name: Container ${{ matrix.image }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [mcp, mcp-alias, ui]
        include:
          - image: mcp
            dockerfile: Dockerfile
          - image: mcp-alias
            dockerfile: Dockerfile.mcp
          - image: ui
            dockerfile: Dockerfile.ui
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          buildkitd-flags: ""

      - name: Build production image without package caches
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          pull: true
          no-cache: true
          tags: souschef-check:ci

      - name: Check runtime identity and dependencies
        run: |
          docker run --rm --entrypoint python souschef-check:ci -c \
            'import os; import importlib.util; import souschef.server; assert os.getuid() == 1001; assert os.getgid() == 1001; assert importlib.util.find_spec("pip") is None; assert importlib.util.find_spec("poetry") is None'

      - name: Exercise MCP protocol
        if: matrix.image != 'ui'
        run: node scripts/verify_docker_mcp.mjs souschef-check:ci

      - name: Exercise UI HTTP health endpoint
        if: matrix.image == 'ui'
        run: |
          container=$(docker run -d --name souschef-ui-check souschef-check:ci)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container" python -c \
              'from urllib.request import urlopen; response = urlopen("http://127.0.0.1:9999/_stcore/health", timeout=2); assert response.status == 200; response.close()'; then
              exit 0
            fi
            sleep 2
          done
          echo "UI failed to become healthy" >&2
          exit 1

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: souschef-check:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: .venv
        key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-${{ matrix.python-version }}-

    - name: Sync dependencies
      run: poetry sync --no-interaction --all-extras

    - name: Adjust pip-audit policy for Dependabot PRs
      if: github.event_name == 'pull_request'
      run: |
        if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
          echo "PIP_AUDIT_POLICY=report-only" >> "$GITHUB_ENV"
          echo "Using report-only pip-audit policy for Dependabot PR."
        fi

    - name: Dependency audit with pip-audit
      run: |
        echo "pip-audit policy: $PIP_AUDIT_POLICY"
        case "$PIP_AUDIT_POLICY" in
          fail-on-any)
            poetry run pip-audit --strict
            ;;
          report-only)
            set +e
            poetry run pip-audit
            audit_exit=$?
            set -e
            if [ "$audit_exit" -ne 0 ]; then
              echo "pip-audit reported findings in report-only mode (exit $audit_exit). Continuing."
            fi
            ;;
          *)
            echo "Unsupported PIP_AUDIT_POLICY: $PIP_AUDIT_POLICY"
            exit 2
            ;;
        esac

    - name: Lint with ruff
      run: poetry run ruff check .

    - name: Type-check with mypy
      run: poetry run mypy souschef

    - name: Run tests with coverage
      run: poetry run pytest --cov=souschef --cov-report=xml --cov-report=term-missing

    - name: Upload Python coverage
      if: matrix.python-version == '3.13'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
      with:
        name: python-coverage
        path: coverage.xml
        retention-days: 1

  test-terraform-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
      with:
        go-version-file: 'go.work'
        cache-dependency-path: terraform-provider/go.sum

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Sync Python dependencies
      run: poetry sync --no-interaction --all-extras

    - name: Set souschef path for Terraform tests
      run: |
        SOUSCHEF_PATH=$(realpath $(poetry run which souschef))
        echo "TF_VAR_souschef_path=$SOUSCHEF_PATH" >> $GITHUB_ENV
        echo "Souschef CLI path: $SOUSCHEF_PATH"

    # Run unit tests first (no TF_ACC) so failures surface quickly.
    # Run ./... to include the main package (main.go) in coverage, not just
    # internal/provider.
    # Acceptance tests (TF_ACC=1) also execute resource.Test cases
    # that require a live Terraform binary and the souschef CLI.
    - name: Run Go unit tests with coverage
      working-directory: terraform-provider
      run: go test ./... -v -timeout 5m -coverprofile=coverage.out -covermode=atomic

    - name: Install Terraform CLI for acceptance tests
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      with:
        terraform_wrapper: false

    - name: Run Terraform provider acceptance tests
      env:
        TF_ACC: "1"
      working-directory: terraform-provider
      run: go test ./internal/provider -v -timeout 15m

    - name: Upload Go coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
      if: always()
      with:
        name: go-coverage
        path: terraform-provider/coverage.out
        retention-days: 1

  test-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Sync dependencies
      run: poetry sync --no-interaction --all-extras

    - name: Test CLI functionality
      run: |
        poetry run souschef --help
        poetry run souschef ls tests/integration/fixtures/sample_cookbook
        poetry run souschef structure tests/integration/fixtures/sample_cookbook
        poetry run souschef metadata tests/integration/fixtures/sample_cookbook/metadata.rb
        if [ -f tests/integration/fixtures/sample_cookbook/recipes/default.rb ]; then
          poetry run souschef recipe tests/integration/fixtures/sample_cookbook/recipes/default.rb
        fi
        TEMPLATE_FILE=$(find tests/integration/fixtures/sample_cookbook/templates/default -name '*.erb' -type f | head -n 1)
        if [ -n "$TEMPLATE_FILE" ]; then
          poetry run souschef template "$TEMPLATE_FILE"
        fi
